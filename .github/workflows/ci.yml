name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # The mutation gate matches multi-line source patterns with LF; the runner defaults to CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # t-review reads an older revision of the extension (git show HEAD~3:...).
          fetch-depth: 0
      # Windows only: the suites assert Windows path semantics (drive letters, backslashes);
      # on Linux they fail by design, not by regression.
      # The extension is a .ts file loaded by node's native type stripping; there are
      # no dependencies, no lockfile and no build step, so nothing to cache or install.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Same list as the installer's pre-install gate, plus the UI suite.
      - run: node tests/t-static.mjs
      - run: node tests/t-llm.mjs
      - run: node tests/t-menu.mjs
      - run: node tests/t-coverage.mjs
      - run: node tests/t-review.mjs
      - run: node tests/t-ui.mjs
      - run: node tests/mutation-check.mjs
